services:
  - type: web
    name: job-board-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
